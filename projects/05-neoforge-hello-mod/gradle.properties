# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# ---- Environment Properties ----
# 最新版本号查询：https://projects.neoforged.net/neoforged/neoforge
# Minecraft 版本必须与 NeoForge 版本匹配（NeoForge 26.1.x 对应 Minecraft 26.1）
minecraft_version=26.1
minecraft_version_range=[26.1]
neo_version=26.1.0.19-beta

# ---- Mod Properties ----
# 模组 ID：2~64 位，小写字母/数字/下划线，以字母开头；必须与 @Mod 注解里的字符串一致
mod_id=hellomod
mod_name=Hello Mod
mod_license=MIT
mod_version=1.0.0
# 应与 Java 源码的顶层包一致
mod_group_id=com.example.hellomod
